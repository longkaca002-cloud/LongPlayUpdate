name: Build LongPlayUpdater Flat

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Create Android project
        run: |
          rm -rf project

          mkdir -p project/app/src/main/java/com/longkaca/playupdater
          mkdir -p project/app/src/main/res/values

          cat > project/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "LongPlayUpdater"
          include(":app")
          EOF

          cat > project/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat > project/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > project/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.longkaca.playupdater'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.longkaca.playupdater'
                  minSdk 31
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
          }

          dependencies {
              implementation 'com.google.android.gms:play-services-base:18.5.0'
          }
          EOF

          cp AndroidManifest.xml project/app/src/main/AndroidManifest.xml
          cp MainActivity.java project/app/src/main/java/com/longkaca/playupdater/MainActivity.java
          cp strings.xml project/app/src/main/res/values/strings.xml
          cp styles.xml project/app/src/main/res/values/styles.xml

          echo "===== PROJECT ====="
          find project -type f

      - name: Build APK
        run: |
          cd project
          gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LongPlayUpdater-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
